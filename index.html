<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#f0f2ec" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23f0f2ec' stroke='%233d4943' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%232f5a9c' stroke-width='2.2'/%3E%3Cpath d='M16 5v6M16 21v6M5 16h6M21 16h6' stroke='%23b04a39' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>Hood Warfare 2 · Bell Yard</title>
    <style>
      #loading {
        z-index: 100;
        color: #3d4943;
        background: #f0f2ec;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 14px;
        font: 13px ui-monospace, "SF Mono", Menlo, monospace;
        transition: opacity 0.3s;
        display: flex;
        position: fixed;
        inset: 0;
      }
      #loading.done {
        opacity: 0;
        pointer-events: none;
      }
      #loading b {
        letter-spacing: 0.08em;
        font-size: 18px;
      }
      #loading .ink {
        background: #dfe3da;
        border-radius: 1px;
        width: 160px;
        height: 2px;
        overflow: hidden;
      }
      #loading .ink:after {
        content: "";
        background: #3d4943;
        width: 40%;
        height: 100%;
        animation: 1.1s ease-in-out infinite ink;
        display: block;
      }
      @keyframes ink {
        0% { transform: translate(-100%); }
        to { transform: translate(250%); }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="loading" role="status">
      <b>HOOD WARFARE 2 · BELL YARD</b>
      <div class="ink"></div>
      <span>inking the printworks district…</span>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
